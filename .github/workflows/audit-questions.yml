name: Check answer keys
on:
  schedule:
    - cron: "47 9 * * *"   # 15:17 IST daily, after the free Gemini limit resets; stops by itself when all are checked
  workflow_dispatch:
    inputs:
      max: { description: "How many questions this run", default: "3000" }
      providers: { description: "AI order", default: "gemini,groq" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/audit_questions.ts
        env:
          AI_PROVIDERS: ${{ github.event.inputs.providers || 'gemini,groq' }}
          AUDIT_MAX: ${{ github.event.inputs.max || '3000' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
