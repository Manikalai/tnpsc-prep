name: Book-back answers (brainkart)
on:
  workflow_dispatch:
    inputs:
      probe: { description: "Debug: print these page URLs (space separated)", required: false, default: "" }
      subjects: { description: "Subject ids/filter (empty = all classes 6-12 Tamil medium)", required: false, default: "" }
      do_import: { description: "Store in the database (leave off for a preview)", type: boolean, default: false }
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - if: ${{ github.event.inputs.probe != '' }}
        run: python scripts/brainkart_probe.py ${{ github.event.inputs.probe }}
