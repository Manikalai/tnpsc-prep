name: Load textbooks
on:
  workflow_dispatch:
    inputs:
      book: { description: "Only this book (part of its title, e.g. 9ஆம் வகுப்பு அறிவியல்). Empty = all books not loaded yet", required: false, default: "" }
      ocr: { description: "OCR: off = use the PDF's own text (fast); auto = OCR pages whose text is broken (slow)", type: choice, options: ["off", "auto"], default: "off" }
      sample_pages: { description: "Check mode: print these PDF pages in full (e.g. 5,81,165)", required: false, default: "" }
      force_detect: { description: "Reload: always use the newly found lessons (even if fewer than before)", type: boolean, default: false }
      reload: { description: "Also reload the text of books already loaded (keeps lessons, notes and questions)", type: boolean, default: false }
      fix_chapters: { description: "Only fix where each lesson starts (books already loaded)", type: boolean, default: false }
      pages_only: { description: "Only upload the page images (for books already loaded)", type: boolean, default: false }
      check_only: { description: "Only check text extraction (no upload)", type: boolean, default: false }
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tam
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/ingest_textbooks.py textbooks/manifest.csv ${{ github.event.inputs.check_only == 'true' && '--check' || '' }} ${{ github.event.inputs.pages_only == 'true' && '--pages-only' || '' }} ${{ github.event.inputs.fix_chapters == 'true' && '--fix-chapters' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          BOOK: ${{ github.event.inputs.book }}
          OCR: ${{ github.event.inputs.ocr }}
          SAMPLE_PAGES: ${{ github.event.inputs.sample_pages }}
          RELOAD: ${{ github.event.inputs.reload }}
          FORCE_DETECT: ${{ github.event.inputs.force_detect == 'true' && '1' || '' }}
