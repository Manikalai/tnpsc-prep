name: Probe PDFs
on:
  workflow_dispatch:
    inputs:
      urls: { description: "PDF links (space separated)", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y tesseract-ocr tesseract-ocr-tam > /dev/null
      - run: pip install requests pymupdf && python scripts/pdf_probe.py ${{ inputs.urls }}
