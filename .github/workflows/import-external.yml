name: Import question sets
on:
  workflow_dispatch:
    inputs:
      source: { description: "Which set", type: choice, options: [youth, hf], default: youth }
      do_import: { description: "Store in the database (leave off for a preview)", type: boolean, default: false }
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/import_external.py --source ${{ inputs.source }} ${{ inputs.do_import && '--import' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TIME_BUDGET_MIN: "165"
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: external-report, path: external_report.json, if-no-files-found: ignore }
