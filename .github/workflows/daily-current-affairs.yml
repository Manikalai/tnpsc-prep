name: Daily current affairs (Tamil)
on:
  schedule:
    - cron: "17 0 * * *"   # 05:47 IST every day
    - cron: "43 1 * * *"   # 07:13 IST backup (GitHub sometimes skips scheduled runs)
    - cron: "11 3 * * *"   # 08:41 IST backup
  workflow_dispatch:
    inputs:
      collect_only: { description: "Only test the news sources (nothing stored, no AI)", type: boolean, default: false }
      dump_url: { description: "Debug: save this page's HTML as an artifact", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: ${{ github.event.inputs.dump_url != '' }}
        run: |
          mkdir -p dump
          curl -sL -A "Mozilla/5.0" "${{ github.event.inputs.dump_url }}" -o dump/page.html
          curl -sL -A "Mozilla/5.0" "$(grep -o 'href="[^"]*currentaffairs-detail[^"]*"' dump/page.html | head -1 | sed 's/href="//;s/"$//' | sed 's#^/#https://www.tnpscthervupettagam.com/#')" -o dump/detail.html || true
          ls -la dump
          echo "===== LIST SNIPPETS"; tr '\n' ' ' < dump/page.html | grep -o '.\{0,900\}currentaffairs-detail.\{0,400\}' | head -3
          echo "===== DETAIL"; tr '\n' ' ' < dump/detail.html | sed 's/<script[^>]*>[^<]*<\/script>//g' | grep -o '<h1.\{0,3500\}' | head -1
      - if: ${{ github.event.inputs.dump_url != '' }}
        uses: actions/upload-artifact@v4
        with: { name: html-dump, path: dump }
      - run: npx tsx scripts/daily_ca.ts ${{ github.event.inputs.collect_only == 'true' && '--collect-only' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
