name: Daily current affairs (Tamil)
on:
  schedule:
    - cron: "17 0 * * *"   # 05:47 IST every day
    - cron: "43 1 * * *"   # 07:13 IST backup (GitHub sometimes skips scheduled runs)
    - cron: "11 3 * * *"   # 08:41 IST backup
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/daily_ca.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
